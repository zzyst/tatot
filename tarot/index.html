<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>TAROT 塔罗</title>
<style>
:root{
  --gold:#d4af6a;
  --gold-bright:#f0d493;
  --gold-dim:#a8874a;
  --text:#f2ead8;
  --muted:#b9ab93;
  --bg-deep:#0a0d18;
  --panel:rgba(12,15,26,.72);
  --line:rgba(212,175,106,.28);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"Kaiti SC","STKaiti","KaiTi","楷体","楷体_GB2312",serif;
  color:var(--text);
  background:#060812;
  overflow:hidden;
  position:relative;
  -webkit-user-select:none;user-select:none;
}
#bg{
  position:fixed;inset:0;z-index:0;
  background:url("assets/background.jpg") center/cover no-repeat;
  filter:saturate(1.05);
}
#bg::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(6,8,18,.35) 0%,rgba(6,8,18,.55) 50%,rgba(6,8,18,.82) 100%);
}
/* stage 容器 */
.stage{
  position:fixed;inset:0;z-index:10;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px 18px;
  opacity:0;pointer-events:none;
  transform:translateY(48px) scale(.95);
  filter:blur(20px);
  transition:opacity 1.8s cubic-bezier(.22,.75,.28,1),transform 1.8s cubic-bezier(.22,.75,.28,1),filter 1.8s cubic-bezier(.22,.75,.28,1);
}
.stage.active{opacity:1;pointer-events:auto;transform:translateY(0) scale(1);filter:blur(0)}
.stage-inner{width:100%;max-width:520px;max-height:100%;overflow-y:auto;display:flex;flex-direction:column;align-items:center;transition:transform 1.8s cubic-bezier(.22,.75,.28,1),opacity 1.8s cubic-bezier(.22,.75,.28,1)}
.stage.active .stage-inner{animation:innerIn 1.6s cubic-bezier(.22,.75,.28,1)}
@keyframes innerIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.stage-inner::-webkit-scrollbar{width:0}

/* 通用按钮 */
.btn{
  border:1px solid var(--line);
  background:linear-gradient(160deg,rgba(212,175,106,.16),rgba(212,175,106,.05));
  color:var(--gold-bright);
  padding:13px 30px;border-radius:34px;font-size:16px;letter-spacing:2px;
  cursor:pointer;transition:all .25s;backdrop-filter:blur(6px);
}
.btn:hover{background:linear-gradient(160deg,rgba(212,175,106,.32),rgba(212,175,106,.12));box-shadow:0 0 22px rgba(212,175,106,.35)}
.btn:active{transform:scale(.97)}
.btn.primary{border:1px solid var(--gold-bright);background:linear-gradient(160deg,rgba(212,175,106,.26),rgba(212,175,106,.1));color:var(--gold-bright);box-shadow:0 0 14px rgba(212,175,106,.18)}
.btn.primary:hover{background:linear-gradient(160deg,rgba(212,175,106,.42),rgba(212,175,106,.18));box-shadow:0 0 26px rgba(212,175,106,.45)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.small{padding:9px 18px;font-size:14px}

/* 欢迎页 */
#welcome .site-title{
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(34px,9vw,52px);letter-spacing:3px;font-weight:500;
  background:linear-gradient(180deg,#f7e7c0,#c9a35f);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  margin-bottom:10px;text-align:center;
}
#welcome .site-sub{font-family:Georgia,serif;font-size:13px;letter-spacing:6px;color:var(--gold-dim);margin-bottom:30px;text-align:center}
#welcome .intro{color:var(--muted);font-size:14px;line-height:1.9;text-align:center;max-width:340px;margin-bottom:38px}
.moon{
  width:64px;height:64px;border-radius:50%;margin-bottom:26px;
  background:radial-gradient(circle at 38% 36%,#f7e7c0,#d4af6a 55%,#a8874a);
  box-shadow:0 0 40px rgba(212,175,106,.5),0 0 90px rgba(212,175,106,.2);
  position:relative;animation:float 5s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}

/* 静心 */
#meditate .m-line{font-size:26px;letter-spacing:4px;margin-bottom:12px;text-align:center;margin-top:8px}
#meditate .m-sub{color:var(--muted);font-size:14px;line-height:1.8;text-align:center;margin-bottom:30px}

/* 选择列表（洗牌/切牌方式） */
.option-list{width:100%;display:flex;flex-direction:column;gap:12px;margin:16px 0 26px}
.option{
  border:1px solid var(--line);border-radius:14px;padding:15px 16px;
  background:var(--panel);backdrop-filter:blur(8px);cursor:pointer;
  transition:all .22s;display:flex;align-items:flex-start;gap:12px;text-align:left;
}
.option:hover{border-color:var(--gold)}
.option.sel{border-color:var(--gold-bright);background:linear-gradient(160deg,rgba(212,175,106,.22),rgba(212,175,106,.08));box-shadow:0 0 18px rgba(212,175,106,.3)}
.option .o-en{font-family:Georgia,serif;color:var(--gold-bright);font-size:15px;margin-bottom:3px}
.option .o-zh{font-size:13px;color:var(--text)}
.option .o-desc{font-size:12px;color:var(--muted);line-height:1.6;margin-top:5px}
.option .check{margin-left:auto;flex-shrink:0;color:var(--gold-bright);font-size:20px;opacity:0;transition:opacity .2s}
.option.sel .check{opacity:1}

/* 洗牌动画区 */
.shuffle-stage{width:100%;height:240px;position:relative;margin:8px 0 20px;border-radius:16px;overflow:hidden}
.shuffle-stage .deck{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:0;height:0}
.shuffle-stage .card{
  position:absolute;width:72px;height:110px;border-radius:6px;
  background:url("assets/card-back.jpg") center/cover no-repeat;
  border:1px solid rgba(212,175,106,.55);
  box-shadow:0 6px 18px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.04);
  transition:transform .6s cubic-bezier(.3,.75,.3,1),opacity .6s;
  will-change:transform;
}
.shuffle-stage .card.deck-thick{box-shadow:0 6px 18px rgba(0,0,0,.55),-2px -2px 0 rgba(212,175,106,.12),inset 0 0 0 1px rgba(255,255,255,.04)}

/* 选牌网格 */
#pick .grid-scroll{width:100%;flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 2px}
.grid{display:grid;grid-template-columns:repeat(13,1fr);gap:4px;width:100%}
.gcard{
  aspect-ratio:3/5;border-radius:4px;cursor:pointer;position:relative;
  background:url("assets/card-back.jpg") center/cover no-repeat;
  box-shadow:0 2px 6px rgba(0,0,0,.5);transition:transform .22s,box-shadow .22s,opacity .22s;
  border:1px solid rgba(212,175,106,.25);
}
.gcard:hover{transform:translateY(-4px);box-shadow:0 8px 18px rgba(0,0,0,.6)}
.gcard.picked{pointer-events:none;transform:none;box-shadow:none;animation:dissolve .9s ease forwards}
.gcard.restoring{animation:restore .6s ease}
@keyframes dissolve{
  0%{opacity:1;filter:blur(0)}
  60%{opacity:.35;filter:blur(4px);transform:scale(.88)}
  100%{opacity:0;filter:blur(10px);transform:scale(.7)}
}
@keyframes restore{
  from{opacity:0;filter:blur(8px);transform:scale(.8)}
  to{opacity:1;filter:blur(0);transform:scale(1)}
}

/* 选牌区域 */
.slotbar{width:100%;display:flex;justify-content:center;gap:14px;padding:14px 0 8px}
.slot{
  width:74px;aspect-ratio:3/5;border:1px dashed var(--line);border-radius:6px;
  position:relative;background:rgba(12,15,26,.5);
}
.slot.filled{background:url("assets/card-back.jpg") center/cover no-repeat;border:1px solid var(--gold-bright);box-shadow:0 0 16px rgba(212,175,106,.4);animation:materialize .9s ease}
@keyframes materialize{
  0%{opacity:0;transform:scale(.75);filter:blur(8px)}
  60%{opacity:.9;transform:scale(1.05);filter:blur(1px)}
  100%{opacity:1;transform:scale(1);filter:blur(0)}
}
.slot .slot-num{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:10px;color:var(--gold-dim);letter-spacing:1px}
.pick-hint{color:var(--muted);font-size:13px;margin:4px 0 10px;letter-spacing:1px}

/* 问题输入 */
#question textarea{
  width:100%;min-height:130px;border-radius:14px;border:1px solid var(--line);
  background:var(--panel);color:var(--text);padding:14px;font-size:15px;line-height:1.7;
  resize:none;backdrop-filter:blur(8px);outline:none;font-family:inherit;
}
#question textarea:focus{border-color:var(--gold-bright)}
#question .count{width:100%;text-align:right;color:var(--muted);font-size:12px;margin-top:6px}
#question .warn{width:100%;color:var(--gold-dim);font-size:12px;margin-top:8px;line-height:1.6;text-align:left}

/* 揭牌 */
.reveal-row{display:flex;justify-content:center;gap:16px;margin:26px 0}
.rcard{width:110px;aspect-ratio:3/5;position:relative;perspective:1000px;cursor:pointer}
.rcard .inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.4,.2,.2,1)}
.rcard.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:8px;overflow:hidden}
.face.back{background:url("assets/card-back.jpg") center/cover no-repeat;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.face.front{transform:rotateY(180deg);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 18px rgba(0,0,0,.6)}
.face.front img{width:100%;height:100%;object-fit:cover;display:block}
.face.front.reversed img{transform:rotate(180deg)}
.rcard .r-label{position:absolute;bottom:-26px;left:0;right:0;text-align:center;font-size:12px;color:var(--gold-bright);letter-spacing:1px}
.rcard .r-pos{position:absolute;top:-24px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted);letter-spacing:2px}

/* 结果 */
.result-card{width:100%;border:1px solid var(--line);border-radius:16px;background:var(--panel);backdrop-filter:blur(10px);padding:18px;margin-bottom:14px}
.result-card h3{font-size:15px;color:var(--gold-bright);margin-bottom:10px;letter-spacing:1px;display:flex;align-items:center;gap:8px}
.result-card p{font-size:14px;line-height:1.85;color:var(--text)}
.result-card .mini-cards{display:flex;gap:10px;justify-content:center;margin-bottom:12px}
.result-card .mini{width:54px;aspect-ratio:3/5;border-radius:5px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.result-card .mini img{width:100%;height:100%;object-fit:cover}
.result-card .mini.rev img{transform:rotate(180deg)}
.result-card .qbox{background:rgba(0,0,0,.25);border-radius:10px;padding:12px;color:var(--muted);font-size:14px;line-height:1.7;font-style:italic}
.placeholder{color:var(--muted);font-size:13px;line-height:1.9}

/* 顶部标题 */
.stage-title{font-family:Georgia,serif;font-size:22px;letter-spacing:4px;color:var(--gold-bright);margin-bottom:6px;text-align:center}
.stage-hint{color:var(--muted);font-size:13px;margin-bottom:16px;text-align:center;letter-spacing:1px}

@media (max-width:480px){
  .grid{gap:3px}
  .rcard{width:88px}
  .reveal-row{gap:10px}
  .slot{width:62px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div id="bg"></div>

<!-- 欢迎页 -->
<section class="stage active" id="welcome">
  <div class="stage-inner">
    <div class="moon"></div>
    <div class="site-title">TAROT 塔罗</div>
    <p class="intro">静下心来，跟随直觉。<br/>抽取三张牌，聆听此刻内心真实的声音。</p>
    <button class="btn primary" onclick="startReading()">开始占卜</button>
  </div>
</section>

<!-- 静心 -->
<section class="stage" id="meditate">
  <div class="stage-inner">
    <div class="m-line">想好你想问的问题。</div>
    <p class="m-sub">让思绪慢下来，专注于此刻真正想知道的事情。</p>
    <button class="btn" onclick="gotoShuffle()">继续</button>
  </div>
</section>

<!-- 洗牌方式 -->
<section class="stage" id="shuffle">
  <div class="stage-inner">
    <div class="stage-title">选择洗牌方式</div>
    <div class="stage-hint">选择一种让你感到自然的方式</div>
    <div class="option-list" id="shuffle-options"></div>
  </div>
</section>

<!-- 洗牌动画 -->
<section class="stage" id="shuffling">
  <div class="stage-inner">
    <div class="stage-title" id="shuffle-title">洗牌中…</div>
    <div class="shuffle-stage" id="shuffle-stage"></div>
  </div>
</section>

<!-- 切牌方式 -->
<section class="stage" id="cut">
  <div class="stage-inner">
    <div class="stage-title">选择切牌方式</div>
    <div class="stage-hint">选择一种切牌方式</div>
    <div class="option-list" id="cut-options"></div>
  </div>
</section>

<!-- 切牌操作 -->
<section class="stage" id="cutting">
  <div class="stage-inner">
    <div class="stage-title" id="cut-title">切牌</div>
    <div class="shuffle-stage" id="cut-stage"></div>
  </div>
</section>

<!-- 选牌 -->
<section class="stage" id="pick">
  <div class="stage-inner" style="max-height:100%">
    <div class="stage-title">选择三张牌</div>
    <div class="stage-hint">跟随直觉，选择三张牌背</div>
    <div class="grid-scroll" id="grid-scroll">
      <div class="grid" id="grid"></div>
    </div>
    <div class="slotbar" id="slotbar">
      <div class="slot" id="slot0"><span class="slot-num">第一张</span></div>
      <div class="slot" id="slot1"><span class="slot-num">第二张</span></div>
      <div class="slot" id="slot2"><span class="slot-num">第三张</span></div>
    </div>
    <div class="pick-hint" id="pick-hint">已选择 0/3</div>
    <button class="btn primary" id="confirm-pick" onclick="gotoQuestion()" disabled>确认选牌</button>
  </div>
</section>

<!-- 问题输入 -->
<section class="stage" id="question">
  <div class="stage-inner">
    <div class="stage-title">写下你的问题</div>
    <div class="stage-hint">把心中所问写下来</div>
    <textarea id="q-text" maxlength="500" placeholder="例如：我和现在喜欢的人，接下来三个月的关系会如何发展？"></textarea>
    <div class="count"><span id="q-count">0</span>/500</div>
    <p class="warn">请勿输入密码、身份证号、银行卡号等敏感信息。塔罗解读仅供娱乐与自我探索，不构成任何医疗、法律或投资建议。</p>
    <div style="display:flex;gap:14px;margin-top:14px">
      <button class="btn ghost small" onclick="gotoPick()">返回选牌</button>
      <button class="btn primary small" id="q-go" onclick="gotoReveal()">开始揭牌</button>
    </div>
  </div>
</section>

<!-- 揭牌 -->
<section class="stage" id="reveal">
  <div class="stage-inner">
    <div class="stage-title">翻开你的牌</div>
    <div class="stage-hint">点击牌背，依次翻开</div>
    <div class="reveal-row" id="reveal-row"></div>
    <button class="btn primary" id="see-result" onclick="showResult()" disabled style="margin-top:34px">查看解读</button>
  </div>
</section>

<!-- 结果 -->
<section class="stage" id="result">
  <div class="stage-inner">
    <div class="stage-title">你的解读</div>
    <div class="stage-hint">过去 · 现在 · 未来</div>
    <div id="result-body"></div>
    <button class="btn primary" style="margin-top:16px" onclick="restart()">重新开始</button>
  </div>
</section>

function show(id){
  document.querySelectorAll('.stage').forEach(s=>s.classList.remove('active'));
  $(id).classList.add('active');
}
function randInt(n){return Math.floor(Math.random()*n)}
function shuffleArr(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=randInt(i+1);[r[i],r[j]]=[r[j],r[i]]}return r}

/* 预抽三张不同的牌 */
function drawCards(){
  const idx = shuffleArr(CARDS.map((_,i)=>i)).slice(0,3);
  return idx.map(i=>({idx:i,rev:Math.random()<0.5}));
}

/* ===== 流程 ===== */
function startReading(){
  session = {draw:drawCards(), picks:[], question:"", revealed:[false,false,false]};
  show('meditate');
  // 3.5 秒后自动进入洗牌
  clearTimeout(window._mt);
  window._mt = setTimeout(()=>{ if(session && document.querySelector('#meditate').classList.contains('active')) gotoShuffle(); }, 5000);
}
function gotoShuffle(){clearTimeout(window._mt);buildShuffleOptions();show('shuffle')}
function gotoPick(){show('pick')}
function gotoQuestion(){show('question');$('q-text').focus()}
function gotoReveal(){session.question=$('q-text').value.trim();buildReveal();show('reveal')}
function showResult(){buildResult();show('result')}
function restart(){session=null;$('q-text').value='';$('q-count').textContent='0';show('welcome')}

/* ===== 洗牌方式 ===== */
const SHUFFLES = [
 {en:"The Overhand Shuffle",zh:"过手洗牌",d:"分批从牌叠中取下小叠牌，落到另一只手中，重复数次。"},
 {en:"The Riffle Shuffle",zh:"交错洗牌",d:"将牌分成两叠，让两侧牌片交错落下并合并。"},
 {en:"The Wash Shuffle",zh:"摊开搅洗",d:"牌面朝下散开，在桌面上轻柔搅动混合，再重新聚拢。"},
 {en:"The Pile Shuffle",zh:"分堆洗牌",d:"将牌依次发放到多个小堆，再按顺序收拢。"}
];
let selShuffle = null;
function buildShuffleOptions(){
  selShuffle=null;
  const c=$('shuffle-options');c.innerHTML='';
  SHUFFLES.forEach((s,i)=>{
    const d=document.createElement('div');d.className='option';d.innerHTML=
      `<div><div class="o-en">${s.en}</div><div class="o-zh">${s.zh}</div><div class="o-desc">${s.d}</div></div><span class="check">✦</span>`;
    d.onclick=()=>{startShuffle(i)};
    c.appendChild(d);
  });
}
function startShuffle(kind){selShuffle=kind;$('shuffle-title').textContent=SHUFFLES[kind].zh+' · 洗牌中…';show('shuffling');setTimeout(()=>renderShuffleAnim(),300);setTimeout(gotoCut,7200)}
function gotoCut(){show('cut');buildCutOptions()}

/* ===== 切牌方式 ===== */
const CUTS = [
 {en:"One-way Cut",zh:"单次切牌",d:"从牌叠顶部拿起一部分放到旁边，再将剩余牌叠叠放到其上。"},
 {en:"Three-way Cut",zh:"三段切牌",d:"将牌分成三部分，按你选择的顺序重新叠放。"}
];
let selCut = null;
function buildCutOptions(){
  selCut=null;
  const c=$('cut-options');c.innerHTML='';
  CUTS.forEach((s,i)=>{
    const d=document.createElement('div');d.className='option';d.innerHTML=
      `<div><div class="o-en">${s.en}</div><div class="o-zh">${s.zh}</div><div class="o-desc">${s.d}</div></div><span class="check">✦</span>`;
    d.onclick=()=>{startCut(i)};
    c.appendChild(d);
  });
}
function startCut(kind){selCut=kind;$('cut-title').textContent=CUTS[kind].zh;show('cutting');setTimeout(()=>renderCutAnim(),300);setTimeout(gotoPick,5200)}

/* ===== 动画工具 ===== */
function makeCards(n, stageId){
  const st=$(stageId || 'shuffle-stage');
  st.innerHTML='';
  const deck=document.createElement('div');deck.className='deck';st.appendChild(deck);
  const cards=[];
  for(let i=0;i<n;i++){
    const c=document.createElement('div');
    c.className='card';
    c.style.left=(-36+(i*0.35))+'px';
    c.style.top=(-55-(i*0.5))+'px';
    deck.appendChild(c);
    cards.push(c);
  }
  return {deck,cards};
}
function rest(cards){ // 归位成牌堆
  cards.forEach((c,i)=>{ c.style.left=(-36+(i*0.35))+'px'; c.style.top=(-55-(i*0.5))+'px'; c.style.transform='rotate(0deg)'; });
}

/* 洗牌动画（仪式动画，不影响预抽） */
function renderShuffleAnim(){
  const {cards}=makeCards(32);
  const kind=selShuffle;
  const rnd=Math.random;
  const N=cards.length;

  if(kind===0){ // 过手洗牌：小叠反复从顶取下落到手上，多轮且每轮位置有随机微调
    let phase=0;
    const t=setInterval(()=>{
      phase++;
      const split=4+(phase%6)*4; // 每轮切下的张数变化
      const handX=-(38+(phase%4)*6); // 手的横向位置微调
      cards.forEach((c,i)=>{
        if(i<split){
          // 顶部小叠：逐张错落地落到手上
          c.style.transform=`translate(${handX-(split-i)*1.8}px,${30+(split-i)*2}px) rotate(${-6+rnd()*4-2}deg)`;
        }else{
          // 剩余牌叠轻微呼吸起伏
          c.style.transform=`translate(${rnd()*4-2}px,${-2+rnd()*3}px) rotate(${rnd()*3-1.5}deg)`;
        }
      });
      if(phase>=12){clearInterval(t);setTimeout(()=>rest(cards),200)}
    },420);
  }else if(kind===1){ // 交错洗牌：两叠分开弯曲→交错落下→再分开→再交错
    cards.forEach((c,i)=>{
      c.style.transform=`translate(${i<N/2?-52:52}px,${rnd()*6-3}px) rotate(${i<N/2?-16:16}deg)`;
      c.style.transformOrigin='center bottom';
    });
    setTimeout(()=>{
      cards.forEach((c,i)=>{
        const seq=i<N/2?i:i-N/2;
        setTimeout(()=>{
          c.style.transform=`translate(${i<N/2?-8:8}px,${-seq*1.1}px) rotate(${i<N/2?-4:4}deg)`;
        }, seq*45);
      });
    },700);
    // 第二次交错，左右互换起始方向，增加变化
    setTimeout(()=>{
      cards.forEach((c,i)=>{
        c.style.transform=`translate(${i<N/2?-44:44}px,${rnd()*6-3}px) rotate(${i<N/2?-13:13}deg)`;
      });
    },2400);
    setTimeout(()=>{
      cards.forEach((c,i)=>{
        const seq=i<N/2?i:i-N/2;
        setTimeout(()=>{
          c.style.transform=`translate(${i<N/2?-6:6}px,${-seq*1.0}px) rotate(${i<N/2?-3:3}deg)`;
        }, seq*45);
      });
    },3100);
    setTimeout(()=>rest(cards),4700);
  }else if(kind===2){ // 摊开搅洗：散开→搅动→再搅动→聚拢，半径逐步收缩
    const wave=(t0, rBase)=>{
      cards.forEach(c=>{
        const a=rnd()*Math.PI*2, r=rBase+rnd()*50;
        c.style.transform=`translate(${Math.cos(a)*r}px,${Math.sin(a)*r*0.55}px) rotate(${rnd()*160-80}deg)`;
      });
    };
    wave(0, 80);
    setTimeout(()=>wave(0,60),1000);
    setTimeout(()=>wave(0,45),2100);
    setTimeout(()=>wave(0,30),3200);
    setTimeout(()=>rest(cards),4500);
  }else{ // 分堆洗牌：逐张分六堆→打乱收拢
    const cols=6;
    cards.forEach((c,i)=>{
      const col=i%cols, row=Math.floor(i/cols);
      setTimeout(()=>{
        c.style.transform=`translate(${(col-2.5)*36}px,${row*2.2}px) rotate(${col%2?5:-5}deg)`;
      }, i*45);
    });
    // 收拢时不是原路返回，而是先向中心聚一点再归位
    setTimeout(()=>{
      cards.forEach((c,i)=>{
        c.style.transform=`translate(${(Math.cos(i)*14)}px,${(Math.sin(i)*14)}px) rotate(${rnd()*8-4}deg)`;
      });
    },2500);
    setTimeout(()=>rest(cards),3400);
  }
}

function renderCutAnim(){
  const {cards}=makeCards(22,'cut-stage');
  if(selCut===0){ // 单次切牌：顶部一叠拿起→放左→剩余叠上→归位
    const top=8;
    // 第一阶段：顶部一叠浮起并移向左侧
    cards.forEach((c,i)=>{
      if(i<top){
        c.style.transform=`translate(${-56}px,${-i*1.3-10}px) rotate(-6deg)`;
      }
    });
    // 第二阶段：剩余牌叠移到右侧
    setTimeout(()=>{
      cards.forEach((c,i)=>{
        if(i>=top) c.style.transform=`translate(56px,${-(i-top)*1.2}px) rotate(3deg)`;
      });
    },1000);
    // 第三阶段：右侧剩余牌叠叠到左侧之上（完成切牌）
    setTimeout(()=>{
      cards.forEach((c,i)=>{
        if(i>=top) c.style.transform=`translate(-20px,${-i*0.8}px) rotate(0)`;
        else c.style.transform=`translate(-20px,${-i*0.8}px) rotate(0)`;
      });
    },2200);
    // 归位
    setTimeout(()=>rest(cards),3600);
  }else{ // 三段切牌：分三堆→按序重新叠放
    const seg=Math.ceil(cards.length/3);
    // 第一阶段：逐张分成三堆
    cards.forEach((c,i)=>{
      const col=i<seg?0:(i<seg*2?1:2);
      setTimeout(()=>{
        c.style.transform=`translate(${(col-1)*56}px,${(i%seg)*1.5}px) rotate(${(col-1)*5}deg)`;
      }, i*55);
    });
    // 第二阶段：按 中→左→右 依次收拢成一叠
    setTimeout(()=>{
      [1,0,2].forEach((col,gi)=>{
        cards.forEach((c,i)=>{
          const cc=i<seg?0:(i<seg*2?1:2);
          if(cc===col){
            setTimeout(()=>{ c.style.transform='translate(0,0) rotate(0)'; }, gi*180 + (i%seg)*45);
          }
        });
      });
    },2000);
    setTimeout(()=>rest(cards),3600);
  }
}

/* ===== 选牌 ===== */
function buildGrid(){
  const g=$('grid');g.innerHTML='';
  for(let i=0;i<78;i++){
    const d=document.createElement('div');d.className='gcard';d.dataset.i=i;
    d.onclick=()=>pickCard(i,d);
    g.appendChild(d);
  }
}
function pickCard(i,el){
  if(!session) return;
  if(session.picks.length>=3) return;
  if(el.classList.contains('picked')) return;
  const slotIndex=session.picks.length;
  session.picks.push(i);
  // 原牌慢慢消散
  el.classList.add('picked');
  // 消散进行到中途后，下方槽位慢慢浮现
  setTimeout(()=>{
    const slotEl=$('slot'+slotIndex);
    slotEl.classList.add('filled');
    slotEl.innerHTML=`<span class="slot-num">第${["一","二","三"][slotIndex]}张</span>`;
    updatePickState();
  },520);
}
function updatePickState(){
  const n=session.picks.length;
  $('pick-hint').textContent='已选择 '+n+'/3';
  $('confirm-pick').disabled = n!==3;
  const gcards=$('grid').children;
  // 满三张后锁定未选牌
  for(let i=0;i<78;i++){
    if(n>=3 && !session.picks.includes(i)) gcards[i].classList.add('locked');
    else gcards[i].classList.remove('locked');
  }
  // 撤销点击已选牌
  for(let s=0;s<3;s++){
    const slotEl=$('slot'+s);
    slotEl.onclick = s<n ? ()=>undoPick(s) : null;
  }
}
function undoPick(s){
  if(!session) return;
  const i=session.picks[s];
  session.picks.splice(s,1);
  const gcards=$('grid').children;
  const gc=gcards[i];
  gc.classList.remove('picked');
  gc.classList.remove('restoring');
  void gc.offsetWidth; // 重新触发动画
  gc.classList.add('restoring');
  // 重建 slot 显示
  for(let k=0;k<3;k++){
    const slotEl=$('slot'+k);
    if(k<session.picks.length){
      slotEl.classList.add('filled');
      slotEl.innerHTML=`<span class="slot-num">第${["一","二","三"][k]}张</span>`;
    }else{
      slotEl.classList.remove('filled');
      slotEl.innerHTML=`<span class="slot-num">第${["一","二","三"][k]}张</span>`;
    }
  }
  updatePickState();
}

/* ===== 揭牌 ===== */
function buildReveal(){
  const r=$('reveal-row');r.innerHTML='';
  session.draw.forEach((d,idx)=>{
    const card=CARDS[d.idx];
    const rc=document.createElement('div');rc.className='rcard';rc.dataset.idx=idx;
    rc.innerHTML=`
      <div class="r-pos">${POS[idx]}</div>
      <div class="inner">
        <div class="face back"></div>
        <div class="face front ${d.rev?'reversed':''}"><img src="${card.img}" alt="${card.zh}"></div>
      </div>
      <div class="r-label">?</div>`;
    rc.onclick=()=>flip(rc,idx);
    r.appendChild(rc);
  });
  $('see-result').disabled=true;
}
function flip(rc,idx){
  if(rc.classList.contains('flipped')) return;
  rc.classList.add('flipped');
  const d=session.draw[idx];
  const card=CARDS[d.idx];
  rc.querySelector('.r-label').textContent=card.zh+(d.rev?'（逆位）':'（正位）');
  session.revealed[idx]=true;
  if(session.revealed.every(v=>v)) $('see-result').disabled=false;
}

/* ===== 结果 ===== */
function buildResult(){
  const body=$('result-body');body.innerHTML='';
  const q=session.question||'（未填写问题）';
  body.appendChild(card('本次问题','<div class="qbox">'+q+'</div>'));

  const overview=document.createElement('div');overview.className='result-card';
  overview.innerHTML='<h3>✦ 牌面总览</h3>';
  const mc=document.createElement('div');mc.className='mini-cards';
  session.draw.forEach((d,idx)=>{
    const card=CARDS[d.idx];
    const m=document.createElement('div');m.className='mini'+(d.rev?' rev':'');
    m.innerHTML=`<img src="${card.img}">`;
    mc.appendChild(m);
  });
  overview.appendChild(mc);
  overview.innerHTML+='<p>'+session.draw.map((d,idx)=>POS[idx]+'：'+CARDS[d.idx].zh+(d.rev?'（逆位）':'（正位）')).join('　')+'</p>';
  body.appendChild(overview);

  // 逐张解读（占位，AI 解读暂未接入）
  session.draw.forEach((d,idx)=>{
    const card=CARDS[d.idx];
    body.appendChild(card(POS[idx]+' · '+card.zh+(d.rev?'（逆位）':'（正位）'),
      '<p class="placeholder">「'+card.zh+'」出现在'+POS[idx]+'的位置'+(d.rev?'（逆位）':'（正位）')+'。AI 智能解读将在后续版本接入，敬请期待。</p>'));
  });
  body.appendChild(card('综合解读','<p class="placeholder">牌与牌之间的联系、整体结论与行动建议，将在 AI 解读功能上线后为你呈现。</p>'));
  body.appendChild(card('专属寄语','<p class="placeholder">愿这三张牌带给你此刻所需的启发与平静。</p>'));
}
function card(title,html){
  const d=document.createElement('div');d.className='result-card';
  d.innerHTML='<h3>✦ '+title+'</h3>'+html;
  return d;
}

/* ===== 问题输入字数 ===== */
$('q-text').addEventListener('input',function(){$('q-count').textContent=this.value.length});

/* ===== 初始化 ===== */
buildGrid();
updatePickState();
</script>
</body>
